name: 'Terraform Deploy Azure VM'

on:
  push:
    branches: [ main ]

env:
  TF_VERSION: '1.5.0'

jobs:
  terraform:
    name: 'Terraform - Azure VM Deployment'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # ---------------------------------------
      # Step 1: Checkout source code
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # Step 2: Azure Login using Service Principal
      # ---------------------------------------
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------------------------------------
      # Step 3: Export Azure SP credentials for Terraform
      # ---------------------------------------
      - name: Export Azure credentials for Terraform
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ secrets.ARM_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.ARM_TENANT_ID }}" >> $GITHUB_ENV

      # ---------------------------------------
      # Step 4: Setup Terraform
      # ---------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ---------------------------------------
      # Step 5: Terraform Init (Backend config)
      # ---------------------------------------
      - name: Terraform Init
        run: terraform init -reconfigure -backend-config=backend.config

      # ---------------------------------------
      # Step 6: Terraform Validate
      # ---------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # ---------------------------------------
      # Step 7: Terraform Plan
      # ---------------------------------------
      - name: Terraform Plan
        run: |
          terraform plan \
            -var "resource_group_name=rg-azure-vm" \
            -var "location=eastus" \
            -var "vnet_cidr=10.0.0.0/16" \
            -var "subnet_cidr=10.0.1.0/24" \
            -var 'allowed_ssh_ips=["0.0.0.0/0"]' \
            -var 'allowed_http_ips=["0.0.0.0/0"]' \
            -var "admin_username=azureuser" \
            -var "vm_size=Standard_B1s" \
            -var "install_docker=true" \
            -var "install_nginx=true" \
            -var "environment=prod"

      # ---------------------------------------
      # Step 8: Terraform Apply (only for main)
      # ---------------------------------------
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply -auto-approve \
            -var "resource_group_name=rg-azure-vm" \
            -var "location=eastus" \
            -var "vnet_cidr=10.0.0.0/16" \
            -var "subnet_cidr=10.0.1.0/24" \
            -var 'allowed_ssh_ips=["0.0.0.0/0"]' \
            -var 'allowed_http_ips=["0.0.0.0/0"]' \
            -var "admin_username=azureuser" \
            -var "vm_size=Standard_B1s" \
            -var "install_docker=true" \
            -var "install_nginx=true" \
            -var "environment=prod"

      # ---------------------------------------
      # Step 9: Upload SSH key (optional)
      # ---------------------------------------
      - name: Upload SSH Key Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key-${{ github.sha }}
          path: azure_vm_key.pem
          retention-days: 1
