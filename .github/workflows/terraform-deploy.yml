name: Terraform Deploy Azure VM

on:
  push:
    branches: [ main ]

env:
  TF_VERSION: '1.5.0'

jobs:
  terraform:
    name: Terraform - prod
    runs-on: ubuntu-latest
    environment: "prod"

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Initialize Terraform
      - name: Terraform Init
        run: |
          cd environments/prod
          terraform init -reconfigure -backend-config=backend.config

      # Validate Terraform
      - name: Terraform Validate
        run: |
          cd environments/prod
          terraform validate

      # Terraform Plan (for visibility)
      - name: Terraform Plan
        run: |
          cd environments/prod
          terraform plan -var-file="terraform.tfvars"

      # Terraform Apply (auto-approve)
      - name: Terraform Apply
        run: |
          cd environments/prod
          terraform apply -auto-approve -var-file="terraform.tfvars"

      # Upload SSH Key Artifact
      - name: Upload SSH Key Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key-${{ github.sha }}
          path: environments/prod/azure_vm_key.pem
          retention-days: 1
