name: 'Terraform Deploy Azure VM'

on:
  push:
    branches: [ main ]

env:
  TF_VERSION: '1.5.0'

jobs:
  terraform:
    name: 'Terraform - prod'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Terraform Init
      - name: Terraform Init
        run: terraform init -reconfigure -backend-config=backend.config

      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        run: |
          terraform plan \
            -var "resource_group_name=rg-azure-vm" \
            -var "location=eastus" \
            -var "vnet_cidr=10.0.0.0/16" \
            -var "subnet_cidr=10.0.1.0/24" \
            -var "allowed_ssh_ips=[\"0.0.0.0/0\"]" \
            -var "allowed_http_ips=[\"0.0.0.0/0\"]" \
            -var "admin_username=azureuser" \
            -var "vm_size=Standard_B1s" \
            -var "install_docker=true" \
            -var "install_nginx=true" \
            -var "environment=prod"

      # Terraform Apply (only on main branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply -auto-approve \
            -var "resource_group_name=rg-azure-vm" \
            -var "location=eastus" \
            -var "vnet_cidr=10.0.0.0/16" \
            -var "subnet_cidr=10.0.1.0/24" \
            -var "allowed_ssh_ips=[\"0.0.0.0/0\"]" \
            -var "allowed_http_ips=[\"0.0.0.0/0\"]" \
            -var "admin_username=azureuser" \
            -var "vm_size=Standard_B1s" \
            -var "install_docker=true" \
            -var "install_nginx=true" \
            -var "environment=prod"

      # Upload SSH Key Artifact
      - name: Upload SSH Key Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key-${{ github.sha }}
          path: azure_vm_key.pem
          retention-days: 1
