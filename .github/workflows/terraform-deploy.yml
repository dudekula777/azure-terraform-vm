name: 'Terraform Deploy Azure VM'

on:
  push:
    branches: [ main ]

env:
  TF_VERSION: '1.5.0'

jobs:
  terraform:
    name: 'Terraform - prod'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate with Azure using Service Principal
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Set environment variables for Terraform Azure provider
      - name: Set Terraform Azure environment variables
        run: |
          echo "ARM_CLIENT_ID=${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}" >> $GITHUB_ENV

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Terraform Init (with backend config)
      - name: Terraform Init
        run: terraform init -reconfigure -backend-config=backend.config

      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars"

      # Terraform Apply (only on main branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -var-file="terraform.tfvars"

      # Upload SSH Key Artifact
      - name: Upload SSH Key Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key-${{ github.sha }}
          path: azure_vm_key.pem
          retention-days: 1
