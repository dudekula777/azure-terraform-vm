name: 'Terraform Deploy Azure VM'

on:
  push:
    branches: [ main ]

env:
  TF_VERSION: '1.5.0'
  RESOURCE_GROUP: rg-azure-vm
  LOCATION: eastus
  VNET_CIDR: 10.0.0.0/16
  SUBNET_CIDR: 10.0.1.0/24
  ALLOWED_SSH_IPS: '["0.0.0.0/0"]'
  ALLOWED_HTTP_IPS: '["0.0.0.0/0"]'
  ADMIN_USERNAME: azureuser
  VM_SIZE: Standard_B1s
  INSTALL_DOCKER: true
  INSTALL_NGINX: true
  ENVIRONMENT: prod

jobs:
  terraform:
    name: 'Terraform - Azure VM Deployment'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Azure CLI Authentication using Service Principal
      - name: Azure CLI Login
        run: |
          az login --service-principal \
            -u $ARM_CLIENT_ID \
            -p $ARM_CLIENT_SECRET \
            --tenant $ARM_TENANT_ID
          az account set --subscription $ARM_SUBSCRIPTION_ID
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      # Terraform Init
      - name: Terraform Init
        run: terraform init -reconfigure

      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          terraform plan \
            -var "resource_group_name=${{ env.RESOURCE_GROUP }}" \
            -var "location=${{ env.LOCATION }}" \
            -var "vnet_cidr=${{ env.VNET_CIDR }}" \
            -var "subnet_cidr=${{ env.SUBNET_CIDR }}" \
            -var "allowed_ssh_ips=${{ env.ALLOWED_SSH_IPS }}" \
            -var "allowed_http_ips=${{ env.ALLOWED_HTTP_IPS }}" \
            -var "admin_username=${{ env.ADMIN_USERNAME }}" \
            -var "vm_size=${{ env.VM_SIZE }}" \
            -var "install_docker=${{ env.INSTALL_DOCKER }}" \
            -var "install_nginx=${{ env.INSTALL_NGINX }}" \
            -var "environment=${{ env.ENVIRONMENT }}"

      # Terraform Apply (only on main)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          terraform apply -auto-approve \
            -var "resource_group_name=${{ env.RESOURCE_GROUP }}" \
            -var "location=${{ env.LOCATION }}" \
            -var "vnet_cidr=${{ env.VNET_CIDR }}" \
            -var "subnet_cidr=${{ env.SUBNET_CIDR }}" \
            -var "allowed_ssh_ips=${{ env.ALLOWED_SSH_IPS }}" \
            -var "allowed_http_ips=${{ env.ALLOWED_HTTP_IPS }}" \
            -var "admin_username=${{ env.ADMIN_USERNAME }}" \
            -var "vm_size=${{ env.VM_SIZE }}" \
            -var "install_docker=${{ env.INSTALL_DOCKER }}" \
            -var "install_nginx=${{ env.INSTALL_NGINX }}" \
            -var "environment=${{ env.ENVIRONMENT }}"

      # Upload SSH Key Artifact
      - name: Upload SSH Key Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key-${{ github.sha }}
          path: azure_vm_key.pem
          retention-days: 1
