name: Terraform Azure VM Deployment (Dev Environment)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Provision Azure VM (Dev)
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./environments/dev
      AZURE_RESOURCE_GROUP: rg-dev-vm
      VM_NAME: dev-vm-instance

    steps:
      # ✅ 1. Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ 2. Azure Login (OIDC)
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      # ✅ 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      # ✅ 4. Cache Terraform dependencies
      - name: Cache Terraform State and Plugins
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TF_WORKING_DIR }}/.terraform
            ${{ env.TF_WORKING_DIR }}/.terraform.lock.hcl
          key: terraform-${{ hashFiles('**/*.tf') }}

      # ✅ 5. Terraform Init
      - name: Terraform Init
        run: terraform -chdir=$TF_WORKING_DIR init -input=false

      # ✅ 6. Import Existing Resource Group only if not in state
      - name: Import Existing Azure Resource Group (if not already managed)
        run: |
          echo "🔍 Checking if Resource Group '${AZURE_RESOURCE_GROUP}' exists in Terraform state..."
          
          # Check if resource is already in Terraform state
          if terraform -chdir=$TF_WORKING_DIR state list | grep -q "azurerm_resource_group.main"; then
            echo "✅ Resource Group already managed by Terraform. Skipping import."
          else
            echo "🔍 Checking if Resource Group '${AZURE_RESOURCE_GROUP}' exists in Azure..."
            if az group show --name $AZURE_RESOURCE_GROUP --subscription ${{ secrets.ARM_SUBSCRIPTION_ID }} >/dev/null 2>&1; then
              echo "✅ Resource Group exists in Azure. Importing into Terraform state..."
              terraform -chdir=$TF_WORKING_DIR import \
                azurerm_resource_group.main \
                "/subscriptions/${{ secrets.ARM_SUBSCRIPTION_ID }}/resourceGroups/${AZURE_RESOURCE_GROUP}" || true
            else
              echo "ℹ️ Resource Group not found in Azure. Terraform will create it."
            fi
          fi

      # ✅ 7. Terraform Validate
      - name: Terraform Validate
        run: terraform -chdir=$TF_WORKING_DIR validate -no-color

      # ✅ 8. Terraform Plan
      - name: Terraform Plan
        run: |
          terraform -chdir=$TF_WORKING_DIR plan -input=false -no-color \
            -var "subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ secrets.ARM_TENANT_ID }}" \
            -var "client_id=${{ secrets.ARM_CLIENT_ID }}" \
            -var "client_secret=${{ secrets.ARM_CLIENT_SECRET }}" \
            -var-file="terraform.tfvars" -out=tfplan

      # ✅ 9. Terraform Apply (Only on main branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform -chdir=$TF_WORKING_DIR apply -auto-approve tfplan
