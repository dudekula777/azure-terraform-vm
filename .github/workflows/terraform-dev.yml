name: 🚀 Terraform Azure VM with Nginx

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./environments/dev
      AZURE_RESOURCE_GROUP: rg-dev-vm
      VM_NAME: dev-vm-instance
      VM_SIZES: Standard_B1s Standard_B2s Standard_B2ms
      # Multiple regions to try
      AZURE_REGIONS: eastus centralus westus2 southcentralus northeurope westeurope

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: 📝 Terraform Format
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} fmt -recursive

      - name: 🔐 Extract Azure Credentials
        id: azure-creds
        run: |
          echo "CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')" >> $GITHUB_OUTPUT
          echo "CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientSecret')" >> $GITHUB_OUTPUT
          echo "SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.subscriptionId')" >> $GITHUB_OUTPUT
          echo "TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.tenantId')" >> $GITHUB_OUTPUT

      - name: 🔍 Check Available Regions
        run: |
          echo "📋 Checking available Azure regions..."
          az login --service-principal -u ${{ steps.azure-creds.outputs.CLIENT_ID }} -p ${{ steps.azure-creds.outputs.CLIENT_SECRET }} --tenant ${{ steps.azure-creds.outputs.TENANT_ID }}
          echo "Available regions for VM deployment:"
          az account list-locations --query "[?metadata.regionType=='Physical'].name" -o table

      # ✅ Try different regions until one works
      - name: 🗺️ Terraform Apply with Regional Fallback
        id: deploy
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          DEPLOY_SUCCESS=false
          
          for region in ${{ env.AZURE_REGIONS }}; do
            echo "🌍 Trying region: $region"
            
            # Create tfvars with this region
            cat > terraform.tfvars << EOF
          location = "$region"
          resource_group_name = "${{ env.AZURE_RESOURCE GROUP }}-${region//-/}"
          vm_name = "${{ env.VM_NAME }}-${region//-/}"
          vm_size = "Standard_B1s"
          
          subscription_id = "${{ steps.azure-creds.outputs.SUBSCRIPTION_ID }}"
          tenant_id = "${{ steps.azure-creds.outputs.TENANT_ID }}"
          client_id = "${{ steps.azure-creds.outputs.CLIENT_ID }}"
          client_secret = "${{ steps.azure-creds.outputs.CLIENT_SECRET }}"
          EOF
            
            # Initialize for this region
            terraform init -reconfigure -input=false
            
            # Try to apply
            if terraform apply -auto-approve -input=false -var-file="terraform.tfvars"; then
              echo "✅ Deployment successful in region: $region"
              echo "SELECTED_REGION=$region" >> $GITHUB_ENV
              echo "RESOURCE_GROUP=${{ env.AZURE_RESOURCE_GROUP }}-${region//-/}" >> $GITHUB_ENV
              echo "VM_NAME=${{ env.VM_NAME }}-${region//-/}" >> $GITHUB_ENV
              DEPLOY_SUCCESS=true
              break
            else
              echo "⚠️  Deployment failed in region: $region, trying next..."
              # Clean up failed deployment state
              rm -f terraform.tfstate* || true
            fi
          done
          
          if [ "$DEPLOY_SUCCESS" = false ]; then
            echo "❌ No suitable region found from: ${{ env.AZURE_REGIONS }}"
            echo "💡 Try using Standard SKU Public IP or check your subscription limits"
            exit 1
          fi

      - name: 📤 Get Outputs
        id: outputs
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          echo "public_ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT
          echo "website_url=$(terraform output -raw website_url)" >> $GITHUB_OUTPUT
          echo "resource_group=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
          echo "location=$(terraform output -raw location)" >> $GITHUB_OUTPUT

      - name: 🩺 Health Check
        run: |
          echo "🔍 Running health checks on VM at ${{ steps.outputs.public_ip }}..."
          MAX_RETRIES=15
          COUNTER=0
          
          until curl -f -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://${{ steps.outputs.public_ip }}; do
            if [ $COUNTER -eq $MAX_RETRIES ]; then
              echo "❌ Health check failed after $MAX_RETRIES attempts"
              echo "VM might be running but Nginx not responding properly"
              exit 1
            fi
            echo "⏳ Waiting for Nginx to be ready... ($((COUNTER+1))/$MAX_RETRIES)"
            sleep 30
            COUNTER=$((COUNTER+1))
          done
          
          echo "✅ Health check passed! Nginx is responding."

      - name: 🌐 Show Deployment Info
        run: |
          echo "🎉 Deployment Successful!"
          echo "========================"
          echo "🌍 Public IP: ${{ steps.outputs.public_ip }}"
          echo "🗺️  Region: ${{ steps.outputs.location }}"
          echo "🖥️  VM Name: ${{ env.VM_NAME }}"
          echo "📦 Resource Group: ${{ steps.outputs.resource_group }}"
          echo "🔗 Website URL: ${{ steps.outputs.website_url }}"
          echo "⚡ SSH Command: ssh azureuser@${{ steps.outputs.public_ip }}"
          echo "🔍 Test Command: curl http://${{ steps.outputs.public_ip }}"

      - name: 📋 Create Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Terraform Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment Details:**" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 **Website URL**: [${{ steps.outputs.website_url }}](${{ steps.outputs.website_url }})" >> $GITHUB_STEP_SUMMARY
            echo "- 🔗 **Public IP**: ${{ steps.outputs.public_ip }}" >> $GITHUB_STEP_SUMMARY
            echo "- 🗺️ **Region**: ${{ steps.outputs.location }}" >> $GITHUB_STEP_SUMMARY
            echo "- 📦 **Resource Group**: ${{ steps.outputs.resource_group }}" >> $GITHUB_STEP_SUMMARY
            echo "- ⚡ **SSH Command**: \`ssh azureuser@${{ steps.outputs.public_ip }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Technical Details:**" >> $GITHUB_STEP_SUMMARY
            echo "- 🛡️ **Public IP SKU**: Standard (to avoid subscription limits)" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 **Availability Zone**: Zone 1" >> $GITHUB_STEP_SUMMARY
            echo "- 🔒 **Security**: SSH (22) and HTTP (80) ports open" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Possible Solutions:**" >> $GITHUB_STEP_SUMMARY
            echo "- Use Standard SKU Public IP addresses" >> $GITHUB_STEP_SUMMARY
            echo "- Try a different Azure region" >> $GITHUB_STEP_SUMMARY
            echo "- Check your subscription limits in Azure Portal" >> $GITHUB_STEP_SUMMARY
            echo "- Request quota increase for Public IP addresses" >> $GITHUB_STEP_SUMMARY
          fi