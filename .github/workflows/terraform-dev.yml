name: Terraform Azure VM Deployment (Dev Environment)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Provision Azure VM (Dev)
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./environments/dev
      AZURE_RESOURCE_GROUP: rg-dev-vm
      VM_NAME: dev-vm-instance
      LOCATION: eastus

    steps:
      # ✅ Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Azure Login using OIDC
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      # ✅ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      # ✅ Terraform Init
      - name: Terraform Init
        run: terraform -chdir=$TF_WORKING_DIR init -input=false

      # ✅ Import Existing Resources if Present
      - name: Import Existing Azure Resources
        run: |
          echo "🔍 Checking for existing Azure resources..."

          # --- Resource Group ---
          if az group show --name $AZURE_RESOURCE_GROUP --subscription ${{ secrets.ARM_SUBSCRIPTION_ID }} >/dev/null 2>&1; then
            echo "✅ Resource Group exists. Importing into Terraform state..."
            terraform -chdir=$TF_WORKING_DIR import \
              azurerm_resource_group.main \
              "/subscriptions/${{ secrets.ARM_SUBSCRIPTION_ID }}/resourceGroups/${AZURE_RESOURCE_GROUP}" || true
          else
            echo "ℹ️ Resource Group not found. It will be created by Terraform."
          fi

          # --- Virtual Machine ---
          VM_ID=$(az vm show --name $VM_NAME --resource-group $AZURE_RESOURCE_GROUP --subscription ${{ secrets.ARM_SUBSCRIPTION_ID }} --query id -o tsv 2>/dev/null || true)
          if [ -n "$VM_ID" ]; then
            echo "✅ VM '$VM_NAME' exists. Importing into Terraform state..."
            terraform -chdir=$TF_WORKING_DIR import azurerm_linux_virtual_machine.main "$VM_ID" || true
          else
            echo "ℹ️ VM not found. It will be created by Terraform."
          fi

      # ✅ Terraform Validate
      - name: Terraform Validate
        run: terraform -chdir=$TF_WORKING_DIR validate -no-color

      # ✅ Terraform Plan
      - name: Terraform Plan
        run: |
          terraform -chdir=$TF_WORKING_DIR plan -input=false -no-color \
            -var "subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ secrets.ARM_TENANT_ID }}" \
            -var "client_id=${{ secrets.ARM_CLIENT_ID }}" \
            -var "client_secret=${{ secrets.ARM_CLIENT_SECRET }}" \
            -var-file="terraform.tfvars" -out=tfplan

      # ✅ Terraform Apply (Only on Main)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform -chdir=$TF_WORKING_DIR apply -auto-approve tfplan
