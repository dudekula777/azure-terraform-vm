name: 'Terraform Dev Environment'

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_WORKING_DIR: './environments/dev'
  AZURE_RESOURCE_GROUP: 'rg-dev-vm'
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

jobs:
  terraform:
    name: 'Terraform Plan & Apply'
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.6.6'
        terraform_wrapper: false

    - name: Azure Login (Service Principal)
      uses: azure/login@v2
      with:
        auth-type: SERVICE_PRINCIPAL
        client-id: ${{ secrets.ARM_CLIENT_ID }}
        tenant-id: ${{ secrets.ARM_TENANT_ID }}
        subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

    - name: Verify Azure Login
      run: |
        echo "✅ Azure CLI Version:"
        az --version
        echo "🔑 Active Subscription:"
        az account show

    - name: Terraform Init
      run: terraform init -input=false
      working-directory: ${{ env.TF_WORKING_DIR }}

    - name: Terraform Validate
      run: terraform validate -no-color
      working-directory: ${{ env.TF_WORKING_DIR }}

    - name: Terraform Plan
      run: |
        terraform plan -input=false -no-color \
          -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
          -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
          -var "client_id=${{ env.ARM_CLIENT_ID }}" \
          -var "client_secret=${{ env.ARM_CLIENT_SECRET }}" \
          -var-file="terraform.tfvars" -out=tfplan
      working-directory: ${{ env.TF_WORKING_DIR }}

    - name: Terraform Apply (main branch only)
      if: github.ref == 'refs/heads/main'
      run: |
        terraform apply -auto-approve -input=false \
          -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
          -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
          -var "client_id=${{ env.ARM_CLIENT_ID }}" \
          -var "client_secret=${{ env.ARM_CLIENT_SECRET }}" \
          -var-file="terraform.tfvars"
      working-directory: ${{ env.TF_WORKING_DIR }}
