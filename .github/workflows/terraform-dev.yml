name: "Terraform Azure VM CI/CD"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write     # ✅ Needed for Azure login OIDC
  contents: read

env:
  TF_WORKING_DIR: ./environments/dev
  AZURE_RESOURCE_GROUP: rg-dev-vm

jobs:
  terraform:
    name: "Terraform Plan and Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # ✅ Correct Azure Login Step
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -no-color

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          echo "🔍 Checking if Resource Group '${AZURE_RESOURCE_GROUP}' exists..."
          az group show --name $AZURE_RESOURCE_GROUP --subscription $ARM_SUBSCRIPTION_ID > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "✅ Resource Group exists. Importing into Terraform state..."
            terraform import azurerm_resource_group.main "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP" || true
          else
            echo "ℹ️ Resource Group not found. Terraform will create it."
          fi

          terraform plan -input=false -no-color \
            -var="subscription_id=$ARM_SUBSCRIPTION_ID" \
            -var="tenant_id=$ARM_TENANT_ID" \
            -var="client_id=$ARM_CLIENT_ID" \
            -var="client_secret=$ARM_CLIENT_SECRET" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          echo "🔍 Checking if Resource Group '${AZURE_RESOURCE_GROUP}' exists..."
          az group show --name $AZURE_RESOURCE_GROUP --subscription $ARM_SUBSCRIPTION_ID > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "✅ Resource Group exists. Importing into Terraform state..."
            terraform import azurerm_resource_group.main "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP" || true
          else
            echo "ℹ️ Resource Group not found. Terraform will create it."
          fi

          echo "🚀 Applying Terraform changes..."
          terraform apply -auto-approve -input=false \
            -var="subscription_id=$ARM_SUBSCRIPTION_ID" \
            -var="tenant_id=$ARM_TENANT_ID" \
            -var="client_id=$ARM_CLIENT_ID" \
            -var="client_secret=$ARM_CLIENT_SECRET"
