name: Terraform Azure VM with Nginx

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./environments/dev
      LOCATION: centralus
      AZURE_RESOURCE_GROUP: rg-dev-vm
      VM_NAME: dev-vm-instance
      VM_SIZES: Standard_B1s Standard_B2s Standard_B2ms

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🧰 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # ✅ Secure and modern authentication using OIDC
      - name: 🔐 Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Terraform Init
        run: terraform -chdir=$TF_WORKING_DIR init -upgrade

      - name: 🧪 Terraform Validate
        run: terraform -chdir=$TF_WORKING_DIR validate

      # ✅ Automatically test VM sizes until one succeeds
      - name: 🧭 Terraform Plan (with retry logic)
        run: |
          set -e
          echo "🔍 Checking available VM sizes..."
          PLAN_SUCCESS=false
          for size in $VM_SIZES; do
            echo "💻 Trying VM size: $size"
            terraform -chdir=$TF_WORKING_DIR plan -no-color -out=tfplan \
              -var "subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
              -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
              -var "location=$LOCATION" \
              -var "vm_size=$size" && PLAN_SUCCESS=true && break
          done
          if [ "$PLAN_SUCCESS" = false ]; then
            echo "❌ No suitable VM size found."
            exit 1
          fi

      # ✅ Correct Terraform Apply syntax (no extra args)
      - name: 🚀 Terraform Apply
        run: |
          echo "🚀 Applying Terraform plan..."
          terraform -chdir=$TF_WORKING_DIR apply -auto-approve tfplan

      # ✅ Display the public IP after deployment
      - name: 🌐 Show Public IP
        run: terraform -chdir=$TF_WORKING_DIR output public_ip

      # ✅ Install and verify Nginx
      - name: 🧩 Install Nginx on VM
        run: |
          PUBLIC_IP=$(terraform -chdir=$TF_WORKING_DIR output -raw public_ip)
          echo "🌍 Connecting to VM ($PUBLIC_IP)..."
          ssh -o StrictHostKeyChecking=no -i ./environments/dev/ssh_key azureuser@$PUBLIC_IP "sudo apt update && sudo apt install -y nginx"
          echo "✅ Nginx installed successfully!"
          echo "🌐 Visit http://$PUBLIC_IP to view your Nginx welcome page"
