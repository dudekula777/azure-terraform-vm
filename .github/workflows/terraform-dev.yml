name: 🚀 Terraform Azure VM with Nginx

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./environments/dev
      LOCATION: centralus
      AZURE_RESOURCE_GROUP: rg-dev-vm
      VM_NAME: dev-vm-instance
      VM_SIZES: Standard_B1s Standard_B2s Standard_B2ms

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # ✅ Auto-format Terraform files instead of just checking
      - name: 📝 Terraform Format
        run: |
          echo "🔧 Formatting Terraform files..."
          terraform -chdir=${{ env.TF_WORKING_DIR }} fmt -recursive
          echo "✅ Formatting completed"

      # ✅ Secure Azure Login
      - name: 🔐 Azure Login (Service Principal)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: false

      - name: 🔍 Verify Azure Login
        run: |
          echo "✅ Logged into Azure subscription:"
          az account show --query name -o tsv

      # ✅ Initialize Terraform
      - name: ⚙️ Terraform Init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init -upgrade -input=false

      # ✅ Validate configuration
      - name: 🧪 Terraform Validate
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} validate -no-color

      # ✅ Plan with retry logic
      - name: 🧭 Terraform Plan (Dynamic VM Size)
        id: plan
        run: |
          set -e
          cd ${{ env.TF_WORKING_DIR }}
          PLAN_SUCCESS=false
          
          for size in ${{ env.VM_SIZES }}; do
            echo "💻 Trying VM size: $size"
            if terraform plan -no-color -out=tfplan \
              -var "location=${{ env.LOCATION }}" \
              -var "vm_size=$size" \
              -var "resource_group_name=${{ env.AZURE_RESOURCE_GROUP }}" \
              -var "prefix=dev"; then
              echo "✅ Plan successful with VM size: $size"
              PLAN_SUCCESS=true
              break
            else
              echo "⚠️  Plan failed with VM size: $size, trying next..."
            fi
          done
          
          if [ "$PLAN_SUCCESS" = false ]; then
            echo "❌ No suitable VM size found from: ${{ env.VM_SIZES }}"
            exit 1
          fi

      # ✅ Apply Terraform changes
      - name: 🚀 Terraform Apply
        run: |
          echo "🚀 Applying Terraform plan..."
          terraform -chdir=${{ env.TF_WORKING_DIR }} apply -auto-approve -input=false "tfplan"

      # ✅ Get Terraform outputs
      - name: 📤 Get Outputs
        id: outputs
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          echo "vm_public_ip=$(terraform output -raw vm_public_ip)" >> $GITHUB_OUTPUT
          echo "website_url=$(terraform output -raw website_url)" >> $GITHUB_OUTPUT
          echo "resource_group=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT

      # ✅ Health check
      - name: 🩺 Health Check
        run: |
          echo "🔍 Running health checks..."
          MAX_RETRIES=12
          COUNTER=0
          
          until curl -f -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://${{ steps.outputs.vm_public_ip }}; do
            if [ $COUNTER -eq $MAX_RETRIES ]; then
              echo "❌ Health check failed after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "⏳ Waiting for VM to be ready... ($((COUNTER+1))/$MAX_RETRIES)"
            sleep 30
            COUNTER=$((COUNTER+1))
          done
          
          echo "✅ Health check passed! Nginx is responding."

      # ✅ Display deployment info
      - name: 🌐 Show Deployment Info
        run: |
          echo "🎉 Deployment Successful!"
          echo "========================"
          echo "🌍 Public IP: ${{ steps.outputs.vm_public_ip }}"
          echo "🔗 Website URL: ${{ steps.outputs.website_url }}"
          echo "📦 Resource Group: ${{ steps.outputs.resource_group }}"
          echo "⚡ SSH Command: ssh azureuser@${{ steps.outputs.vm_public_ip }}"

      # ✅ Create deployment summary
      - name: 📋 Create Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Terraform Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment Details:**" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 **Website URL**: [${{ steps.outputs.website_url }}](${{ steps.outputs.website_url }})" >> $GITHUB_STEP_SUMMARY
            echo "- 🔗 **Public IP**: ${{ steps.outputs.vm_public_ip }}" >> $GITHUB_STEP_SUMMARY
            echo "- 📦 **Resource Group**: ${{ steps.outputs.resource_group }}" >> $GITHUB_STEP_SUMMARY
            echo "- ⚡ **SSH Command**: \`ssh azureuser@${{ steps.outputs.vm_public_ip }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the workflow logs for detailed error information." >> $GITHUB_STEP_SUMMARY
          fi