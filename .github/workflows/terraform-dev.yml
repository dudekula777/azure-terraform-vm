name: Deploy Azure VM with Nginx via Terraform

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TF_WORKING_DIR: ./environments/dev
      AZURE_RESOURCE_GROUP: rg-dev-vm
      LOCATION: centralus
      VM_NAME: dev-vm
      VM_SIZES: "Standard_B1s Standard_B2s Standard_B2ms"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Ensure Resource Group Exists
        run: |
          if [ "$(az group exists --name $AZURE_RESOURCE_GROUP)" = "false" ]; then
            echo "🆕 Creating resource group..."
            az group create --name $AZURE_RESOURCE_GROUP --location $LOCATION
          else
            echo "✅ Resource group already exists."
          fi

      - name: Terraform Plan with VM Size Fallback
        id: plan
        run: |
          set -e
          PLAN_SUCCESS=false
          for size in $VM_SIZES; do
            echo "💻 Trying VM size: $size"
            terraform plan -no-color -out=tfplan \
              -var "subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
              -var "tenant_id=${{ secrets.ARM_TENANT_ID }}" \
              -var "client_id=${{ secrets.ARM_CLIENT_ID }}" \
              -var "client_secret=${{ secrets.ARM_CLIENT_SECRET }}" \
              -var "location=$LOCATION" \
              -var "vm_size=$size" \
              && PLAN_SUCCESS=true && break
          done
          if [ "$PLAN_SUCCESS" = false ]; then
            echo "❌ No suitable VM size found."
            exit 1
          fi

      - name: Terraform Apply (Safe Import)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🚀 Applying Terraform plan..."
          if terraform state list | grep -q "azurerm_resource_group.main"; then
            echo "✔️ RG already tracked by Terraform."
          else
            echo "📦 Importing existing RG..."
            terraform import \
              azurerm_resource_group.main \
              "/subscriptions/${{ secrets.ARM_SUBSCRIPTION_ID }}/resourceGroups/${AZURE_RESOURCE_GROUP}" || true
          fi

          terraform apply -auto-approve tfplan

      - name: Show Outputs
        run: terraform output -no-color
