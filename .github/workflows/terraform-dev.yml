name: Terraform Azure VM Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  TF_WORKING_DIR: ./environments/dev
  AZURE_RESOURCE_GROUP: rg-dev-vm

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    steps:
      # Step 1️⃣ - Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2️⃣ - Set up Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # Step 3️⃣ - Azure Login using Service Principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

      # Step 4️⃣ - Terraform Init
      - name: Terraform Init
        run: terraform -chdir=$TF_WORKING_DIR init

      # Step 5️⃣ - Check and Import Existing Resource Group
      - name: Check and Import Existing Resource Group
        run: |
          echo "🔍 Checking if Resource Group '${AZURE_RESOURCE_GROUP}' exists..."
          if az group show --name $AZURE_RESOURCE_GROUP --subscription ${{ secrets.ARM_SUBSCRIPTION_ID }} >/dev/null 2>&1; then
            echo "✅ Resource Group exists. Importing into Terraform state..."
            terraform -chdir=$TF_WORKING_DIR import \
              -var "subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
              -var "tenant_id=${{ secrets.ARM_TENANT_ID }}" \
              -var "client_id=${{ secrets.ARM_CLIENT_ID }}" \
              -var "client_secret=${{ secrets.ARM_CLIENT_SECRET }}" \
              azurerm_resource_group.main \
              "/subscriptions/${{ secrets.ARM_SUBSCRIPTION_ID }}/resourceGroups/${AZURE_RESOURCE_GROUP}" || true
          else
            echo "ℹ️ Resource Group not found. Terraform will create it."
          fi

      # Step 6️⃣ - Terraform Validate
      - name: Terraform Validate
        run: terraform -chdir=$TF_WORKING_DIR validate

      # Step 7️⃣ - Terraform Plan
      - name: Terraform Plan
        run: terraform -chdir=$TF_WORKING_DIR plan -out=tfplan

      # Step 8️⃣ - Terraform Apply
      - name: Terraform Apply
        run: terraform -chdir=$TF_WORKING_DIR apply -auto-approve tfplan

      # Step 9️⃣ - Post Azure Logout
      - name: Post Azure Logout
        if: always()
        run: az logout
