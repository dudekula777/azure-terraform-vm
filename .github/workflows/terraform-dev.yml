name: 🚀 Terraform Azure VM with Nginx

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write     # Required for OIDC authentication
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./environments/dev
      LOCATION: centralus
      AZURE_RESOURCE_GROUP: rg-dev-vm
      VM_NAME: dev-vm-instance
      VM_SIZES: Standard_B1s Standard_B2s Standard_B2ms

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # ✅ Secure OIDC-based login (no client secret required)
      - name: 🔐 Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ✅ Initialize Terraform
      - name: ⚙️ Terraform Init
        run: terraform -chdir=$TF_WORKING_DIR init -upgrade

      # ✅ Validate configuration
      - name: 🧪 Terraform Validate
        run: terraform -chdir=$TF_WORKING_DIR validate

      # ✅ Plan with retry logic (tries alternate VM sizes)
      - name: 🧭 Terraform Plan (Dynamic VM Size)
        run: |
          set -e
          cd $TF_WORKING_DIR
          PLAN_SUCCESS=false
          for size in $VM_SIZES; do
            echo "💻 Trying VM size: $size"
            terraform plan -no-color -out=tfplan \
              -var "subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
              -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
              -var "location=$LOCATION" \
              -var "vm_size=$size" && PLAN_SUCCESS=true && break
          done
          if [ "$PLAN_SUCCESS" = false ]; then
            echo "❌ No suitable VM size found."
            exit 1
          fi

      # ✅ Apply Terraform changes
      - name: 🚀 Terraform Apply
        run: |
          echo "🚀 Applying Terraform plan..."
          terraform -chdir=$TF_WORKING_DIR apply -auto-approve "tfplan"

      # ✅ Display outputs (Public IP + Nginx URL)
      - name: 🌐 Show Public IP & Website URL
        run: |
          cd $TF_WORKING_DIR
          echo "🌍 Public IP:"
          terraform output -raw vm_public_ip
          echo "🔗 Website URL:"
          terraform output -raw website_url
