name: 'Terraform Dev Environment'

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_WORKING_DIR: './environments/dev'
  AZURE_RESOURCE_GROUP: 'rg-dev-vm'
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

jobs:
  terraform:
    name: 'Terraform Plan & Apply'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'
          terraform_wrapper: false

      # Step 3: Login to Azure using Service Principal JSON secret
      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 4: Verify Azure Login
      - name: Verify Azure Login
        run: |
          echo "✅ Azure CLI Version:"
          az --version
          echo "🔑 Active Subscription:"
          az account show

      # Step 5: Terraform Format Check
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Step 6: Terraform Init
      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Step 7: Import Existing Resource Group (if exists)
      - name: Import existing Resource Group (if it exists)
        run: |
          set +e
          echo "🔍 Checking if Resource Group '${AZURE_RESOURCE_GROUP}' exists..."
          az group show --name $AZURE_RESOURCE_GROUP --subscription $ARM_SUBSCRIPTION_ID > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "✅ Resource Group exists. Importing into Terraform state..."
            terraform import azurerm_resource_group.main "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP" || true
          else
            echo "ℹ️ Resource Group not found. Terraform will create it."
          fi
          set -e
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Step 8: Terraform Validate
      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Step 9: Terraform Plan
      - name: Terraform Plan
        run: |
          terraform plan -input=false -no-color \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            -var "client_id=${{ env.ARM_CLIENT_ID }}" \
            -var "client_secret=${{ env.ARM_CLIENT_SECRET }}" \
            -var-file="terraform.tfvars" -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Step 10: Terraform Apply (only for main branch)
      - name: Terraform Apply (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply -auto-approve -input=false \
            -var "subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -var "tenant_id=${{ env.ARM_TENANT_ID }}" \
            -var "client_id=${{ env.ARM_CLIENT_ID }}" \
            -var "client_secret=${{ env.ARM_CLIENT_SECRET }}" \
            -var-file="terraform.tfvars"
        working-directory: ${{ env.TF_WORKING_DIR }}
