name: Terraform Azure VM Deployment (Dev Environment)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Provision Azure VM (Dev)
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./environments/dev
      AZURE_RESOURCE_GROUP: rg-dev-vm
      VM_NAME: dev-vm-instance
      LOCATION: centralus
      VM_SIZES: "Standard_B2s Standard_B1s Standard_B2ms"

    steps:
      # ✅ 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ 2. Azure Login (OIDC)
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      # ✅ 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      # ✅ 4. Terraform Init (required before import)
      - name: Terraform Init
        run: terraform -chdir=$TF_WORKING_DIR init -input=false

      # ✅ 5. Ensure and Import Resource Group
      - name: Ensure and Import Resource Group
        run: |
          echo "🔍 Checking if resource group '$AZURE_RESOURCE_GROUP' exists in Azure..."
          if az group show --name $AZURE_RESOURCE_GROUP >/dev/null 2>&1; then
            echo "✅ Resource group exists."
            if terraform -chdir=$TF_WORKING_DIR state list | grep -q "azurerm_resource_group.main"; then
              echo "✔️ RG already tracked by Terraform — skipping import."
            else
              echo "📦 Importing existing RG into Terraform state..."
              terraform -chdir=$TF_WORKING_DIR import \
                azurerm_resource_group.main \
                "/subscriptions/${{ secrets.ARM_SUBSCRIPTION_ID }}/resourceGroups/${AZURE_RESOURCE_GROUP}" || true
            fi
          else
            echo "🆕 RG not found — creating new one..."
            az group create --name $AZURE_RESOURCE_GROUP --location $LOCATION
          fi

      # ✅ 6. Terraform Validate
      - name: Terraform Validate
        run: terraform -chdir=$TF_WORKING_DIR validate -no-color

      # ✅ 7. Terraform Plan (with dynamic region + size fallback)
      - name: Terraform Plan (Auto Retry)
        id: plan_dynamic
        run: |
          PLAN_SUCCESS=false
          for size in $VM_SIZES; do
            echo "💻 Trying VM size: $size in region: $LOCATION"
            terraform -chdir=$TF_WORKING_DIR plan -input=false -no-color \
              -var "subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
              -var "tenant_id=${{ secrets.ARM_TENANT_ID }}" \
              -var "client_id=${{ secrets.ARM_CLIENT_ID }}" \
              -var "client_secret=${{ secrets.ARM_CLIENT_SECRET }}" \
              -var "location=$LOCATION" \
              -var "vm_size=$size" \
              -var-file="terraform.tfvars" -out=tfplan && PLAN_SUCCESS=true && break
            echo "⚠️ Failed for $size — trying next..."
          done

          if [ "$PLAN_SUCCESS" = false ]; then
            echo "❌ No suitable VM SKU available in $LOCATION"
            exit 1
          fi

      # ✅ 8. Terraform Apply (main branch only)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🚀 Applying Terraform plan..."
          terraform -chdir=$TF_WORKING_DIR apply -auto-approve tfplan

      # ✅ 9. Terraform Outputs
      - name: Terraform Outputs
        if: success()
        run: terraform -chdir=$TF_WORKING_DIR output -no-color
