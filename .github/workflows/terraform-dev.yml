name: 'Terraform Dev Environment (OIDC Auth)'

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

env:
  TF_WORKING_DIR: './environments/dev'
  AZURE_RESOURCE_GROUP: 'rg-dev-vm'
  ARM_USE_OIDC: true

jobs:
  terraform:
    name: 'Terraform Plan & Apply'
    runs-on: ubuntu-latest
    environment: dev

    # ✅ Required for OIDC authentication
    permissions:
      id-token: write
      contents: read

    steps:
    # ----------------------------
    # Checkout repository
    # ----------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # ----------------------------
    # Setup Terraform
    # ----------------------------
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.6.6'
        terraform_wrapper: false

    # ----------------------------
    # Azure Login via OIDC (No secrets!)
    # ----------------------------
    - name: Azure Login with OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        auth-type: OIDC

    - name: Verify Azure Login
      run: |
        echo "✅ Azure CLI Version:"
        az --version
        echo "🔑 Active Subscription:"
        az account show

    # ----------------------------
    # Terraform Format / Init / Validate
    # ----------------------------
    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    - name: Terraform Init
      run: terraform init -input=false
      working-directory: ${{ env.TF_WORKING_DIR }}

    - name: Terraform Validate
      run: terraform validate -no-color
      working-directory: ${{ env.TF_WORKING_DIR }}

    # ----------------------------
    # Terraform Plan
    # ----------------------------
    - name: Terraform Plan
      id: plan
      run: |
        terraform plan -input=false -no-color \
          -var-file="terraform.tfvars" -out=tfplan
      working-directory: ${{ env.TF_WORKING_DIR }}

    - name: Upload Terraform Plan Artifact
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan
        path: ${{ env.TF_WORKING_DIR }}/tfplan
        retention-days: 7

    # ----------------------------
    # Terraform Apply (only on main push)
    # ----------------------------
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      id: apply
      run: |
        terraform apply -auto-approve -input=false -var-file="terraform.tfvars"
      working-directory: ${{ env.TF_WORKING_DIR }}

    # ----------------------------
    # Extract Terraform Outputs
    # ----------------------------
    - name: Extract Terraform Outputs
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      id: outputs
      run: |
        echo "vm_public_ip=$(terraform output -raw vm_public_ip)" >> $GITHUB_OUTPUT
        echo "website_url=$(terraform output -raw website_url)" >> $GITHUB_OUTPUT
      working-directory: ${{ env.TF_WORKING_DIR }}

    # ----------------------------
    # Health Check (Optional)
    # ----------------------------
    - name: Health Check
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "🩺 Testing Nginx web server..."
        max_retries=20
        counter=0
        until curl -f http://${{ steps.outputs.outputs.vm_public_ip }}; do
          if [ $counter -eq $max_retries ]; then
            echo "❌ Health check failed after $max_retries attempts"
            exit 1
          fi
          echo "Waiting for VM to be ready... ($((counter+1))/$max_retries)"
          sleep 20
          counter=$((counter+1))
        done
        echo "✅ Health check successful!"

    # ----------------------------
    # Deployment Summary
    # ----------------------------
    - name: Show Deployment Info
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "🚀 Deployment Successful!"
        echo "VM Public IP: ${{ steps.outputs.outputs.vm_public_ip }}"
        echo "Website URL: ${{ steps.outputs.outputs.website_url }}"
        echo "SSH Command: ssh -i <private_key> azureuser@${{ steps.outputs.outputs.vm_public_ip }}"
